name: Deploy CultiPilot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Las credenciales de Supabase se leen de .env.production, que esta
      # versionado en el repo. No se pasan por secrets porque son publicas
      # por diseno (terminan en el bundle del navegador igual) y porque un
      # secret vacio pisaba el valor del archivo con una cadena vacia.
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
